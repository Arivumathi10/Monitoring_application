name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    # Ephemeral CI values only — never real production secrets.
    env:
      SECRET_KEY: ci-test-secret-key-not-for-prod
      ADMIN_USERNAME: ciadmin
      # Hash of throwaway password "citestpass" — not a production credential.
      ADMIN_PASSWORD_HASH: scrypt:32768:8:1$nnz8K6uqS8LVxIql$01316dca126408013686109fa38f5943599c5b4e9cf23af4b050e337578873a409557fb75670c5f3cb07ee5f4a808c1c4a5061201091f0c3b2f2ec9e0ba08984
      SERVERS_KEY: ci-servers-key-not-for-prod-32bytes!!
      FLASK_ENV: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint / compile
        run: |
          python -m compileall -q app tests run.py
          ruff check app tests run.py

      - name: Run tests
        run: pytest -q

      - name: Dependency audit
        run: pip-audit -r app/requirements.txt
