{% extends "base.html" %}
{% block title %}Sign in — System Monitor{% endblock %}
{% block content %}
<section class="auth-panel">
    <h1>Sign in</h1>
    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required maxlength="128" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required maxlength="512" autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Sign in</button>
    </form>
</section>
{% endblock %}
